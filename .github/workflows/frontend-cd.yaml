name: Frontend Continuous Deployment

on:
  push:
    branches: [main]
    paths:
      - "starter/frontend/**"
      - ".github/workflows/frontend-cd.yaml"
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: frontend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-frontend-npm-${{ hashFiles('starter/frontend/package-lock.json') }}
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: starter/frontend/.nvmrc
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-frontend-npm-${{ hashFiles('starter/frontend/package-lock.json') }}
      - run: npm ci
      - run: npm run test -- --watchAll=false
        env:
          CI: true

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    env:
      MOVIE_API_URL: ${{ vars.MOVIE_API_URL }}
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: image
        run: echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}" >> "$GITHUB_OUTPUT"
      - run: |
          if [ -z "$MOVIE_API_URL" ]; then
            echo "MOVIE_API_URL repository variable is required"
            exit 1
          fi
          docker build --build-arg REACT_APP_MOVIE_API_URL="$MOVIE_API_URL" --tag "${{ steps.image.outputs.image }}" starter/frontend
      - run: docker push "${{ steps.image.outputs.image }}"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: imranismail/setup-kustomize@v2
      - run: aws eks update-kubeconfig --name cluster --region "${{ env.AWS_REGION }}"
      - name: Deploy frontend to EKS
        run: |
          cd starter/frontend/k8s
          kustomize edit set image frontend="${{ needs.build.outputs.image }}"
          kubectl apply -k .
          kubectl rollout status deployment/frontend --timeout=180s

      - name: Wait for LoadBalancer endpoint
        run: |
          for attempt in $(seq 1 40); do
            FRONTEND_URL="$(kubectl get service frontend -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')"
            if [ -z "$FRONTEND_URL" ]; then
              FRONTEND_URL="$(kubectl get service frontend -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
            fi
            if [ -n "$FRONTEND_URL" ]; then
              echo "FRONTEND_URL=$FRONTEND_URL" >> "$GITHUB_ENV"
              echo "Frontend LoadBalancer assigned: http://$FRONTEND_URL"
              kubectl get service frontend
              exit 0
            fi
            echo "Waiting for LoadBalancer external endpoint (attempt ${attempt}/40)..."
            sleep 10
          done
          echo "Frontend LoadBalancer did not receive an external endpoint" >&2
          kubectl describe service frontend
          exit 1

      - name: Verify frontend is serving
        run: |
          FRONTEND_URL="http://${FRONTEND_URL}"
          echo "Checking that the frontend microservice is reachable at ${FRONTEND_URL} ..."
          for attempt in $(seq 1 30); do
            HTTP_CODE="$(curl -s -o /dev/null -w '%{http_code}' "${FRONTEND_URL}" || true)"
            if [ "${HTTP_CODE}" = "200" ]; then
              echo "RESULT: Frontend is serving HTTP 200 at ${FRONTEND_URL}"
              echo "==>>>> FRONTEND_MICROSERVICE_URL ${FRONTEND_URL}"
              echo "## Frontend Application" >> "$GITHUB_STEP_SUMMARY"
              echo "The frontend microservice is deployed and serving at: ${FRONTEND_URL}" >> "$GITHUB_STEP_SUMMARY"
              echo "${FRONTEND_URL}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "HTTP ${HTTP_CODE} from frontend (attempt ${attempt}/30), retrying..."
            sleep 10
          done
          echo "Frontend never returned HTTP 200. It is not yet serving." >&2
          kubectl get pods -l app=frontend
          kubectl logs deployment/frontend --tail=50
          exit 1
